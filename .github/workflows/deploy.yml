name: Build and deploy Jekyll site to gh-pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Install Bundler and gems
        run: |
          gem install bundler
          bundle install

      - name: Build Jekyll site
        run: bundle exec jekyll build -d _site

      - name: Deploy to gh-pages (git push)
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd _site
          git init
          git add -A
          git commit -m "Deploy from Actions: $GITHUB_SHA" || echo "No changes to commit"
          git branch -M gh-pages
          git push --force "https://x-access-token:${TOKEN}@github.com/${REPO}.git" gh-pages
